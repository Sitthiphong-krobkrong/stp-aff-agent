[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stp-aff-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "Pillow>=10", "edge-tts>=6.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: renders real video with ffmpeg"]
